name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile sync scripts
        run: |
          python -m py_compile \
            scripts/google_sheets_auth.py \
            scripts/sync_issues_snapshot.py \
            scripts/process_write_queue.py \
            scripts/process_write_queue_v2.py \
            scripts/prepare_iwtech_sysop_queue_v2.py \
            scripts/prepare_iwtech_sysop_comment_queue_v2.py \
            scripts/prepare_iwtech_sysop_update_queue_v2.py \
            scripts/reconcile_sync_issue_map_v2.py \
            scripts/reconcile_iwtech_sysop_sync_cursors_v2.py
